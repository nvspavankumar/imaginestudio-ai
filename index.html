<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ImagineStudio AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b18;color:#f5f6ff;font:16px/1.5 system-ui,Arial}.wrap{max-width:1000px;margin:auto;padding:24px 16px}.brand{font-weight:800;font-size:1.3rem}.hero{text-align:center;padding:35px 0}.hero h1{font-size:clamp(2rem,6vw,3.5rem)}.grad{background:linear-gradient(90deg,#c4b5fd,#67e8f9);color:transparent;background-clip:text}.panel{max-width:820px;margin:auto;background:#12162a;border:1px solid #2a3150;border-radius:20px;padding:22px}.tabs,.row{display:flex;gap:10px}.tabs button{flex:1}.row>*{flex:1;min-width:0}button,textarea,select{font:inherit;border-radius:11px;padding:12px}button{cursor:pointer;border:1px solid #3b4263;background:#171d35;color:#fff}.active,.generate{background:linear-gradient(110deg,#a78bfa,#67e8f9);color:#101124;border:0;font-weight:800}label{display:block;margin:14px 0 6px;font-weight:700}textarea,select{width:100%;background:#0b0e1d;color:white;border:1px solid #2a3150}textarea{height:120px}.generate{width:100%;margin-top:16px}.status,.note{color:#a5aecb;font-size:.9rem;margin-top:12px}.result{display:grid;gap:12px;justify-items:center;margin-top:18px}.result img,.result video{max-width:100%;max-height:600px;border-radius:12px}.download{background:#d9f99d;color:#11142a;text-decoration:none;padding:10px 14px;border-radius:9px;font-weight:bold}@media(max-width:600px){.row{display:block}.panel{padding:14px}}
</style></head><body><div class="wrap"><div class="brand">✦ ImagineStudio <span class="grad">AI</span></div>
<header class="hero"><div class="grad">CREATE • IMAGINE • INSPIRE</div><h1>Your ideas, <span class="grad">made visual.</span></h1><p>AI image and video creation. No login or signup.</p></header>
<main class="panel"><div class="tabs"><button id="imgTab" class="active">🖼️ Create Image</button><button id="vidTab">🎬 Create Video</button></div>
<label for="prompt">Describe what you want to create</label><textarea id="prompt" maxlength="1200" placeholder="A tiny house in a magical forest at sunrise, cinematic lighting..."></textarea>
<div class="row"><div><label for="style">Style</label><select id="style"><option>Realistic</option><option>Anime</option><option>3D render</option><option>Watercolor</option><option>Fantasy</option><option>Cinematic</option></select></div><div><label for="ratio">Aspect ratio</label><select id="ratio"><option>1:1</option><option>16:9</option><option>9:16</option></select></div><div><label for="quality">Output</label><select id="quality"><option>Standard</option><option>High</option></select></div></div>
<button id="generate" class="generate">✨ Generate Image</button><div id="status" class="status" aria-live="polite"></div><div id="result" class="result"></div>
<p class="note">AI availability depends on the provider and its usage limits. Do not enter private information. Public no-login websites need abuse protection.</p></main></div>
<script>
let mode='image';const $=s=>document.querySelector(s), imgTab=$('#imgTab'),vidTab=$('#vidTab'),btn=$('#generate'),status=$('#status'),result=$('#result');
function setMode(m){mode=m;imgTab.classList.toggle('active',m==='image');vidTab.classList.toggle('active',m==='video');btn.textContent=m==='image'?'✨ Generate Image':'🎬 Generate Video';status.textContent='';result.replaceChildren()}
imgTab.onclick=()=>setMode('image');vidTab.onclick=()=>setMode('video');
btn.onclick=async()=>{const prompt=$('#prompt').value.trim();if(!prompt){status.textContent='Please enter a prompt.';return}btn.disabled=true;status.textContent='Sending request…';result.replaceChildren();
try{const r=await fetch('/.netlify/functions/generate-'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,style:$('#style').value,ratio:$('#ratio').value,quality:$('#quality').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Generation failed');
const url=mode==='image'?d.imageUrl:d.videoUrl;if(!url)throw Error(d.error||'No media returned');let el=document.createElement(mode==='image'?'img':'video');el.src=url;el.alt='Generated result';if(mode==='video'){el.controls=true;el.playsInline=true}result.append(el);let a=document.createElement('a');a.className='download';a.href=url;a.download='imaginestudio-'+mode+(mode==='image'?'.png':'.mp4');a.textContent='⬇ Download result';a.target='_blank';a.rel='noopener';result.append(a);status.textContent='Your result is ready.';
}catch(e){status.textContent=e.message+' Check setup instructions and provider configuration.'}finally{btn.disabled=false}};
</script></body></html>
